name: Robot Cap Nhat Du Lieu Xo So Loc Phat Tuan Thu AdSense
on:
  schedule:
    - cron: '45 9 * * *'   # 16h45 VN
    - cron: '45 11 * * *'  # 18h45 VN
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4
    - run: python auto_bot.py
    - run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add index.html
        git diff --quiet && git diff --staged --quiet || (git commit -m "Robot cap nhat" && git push)
