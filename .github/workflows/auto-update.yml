name: Auto Update Bot

on:
  schedule:
    # 1. Cập nhật dữ liệu Kinh tế (Vàng, USD, Xăng) mỗi giờ (phút thứ 0)
    - cron: '0 * * * *'
    # 2. Cập nhật Xổ số ngay sau khi quay xong (Giờ UTC, +7 = Giờ Việt Nam)
    # 09:45 UTC = 16:45 VN (Chốt Miền Nam)
    # 10:45 UTC = 17:45 VN (Chốt Miền Trung)
    # 11:45 UTC = 18:45 VN (Chốt Miền Bắc & Vietlott)
    - cron: '45 9,10,11 * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công trên web

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Kiểm tra mã nguồn
      uses: actions/checkout@v3

    - name: Cài đặt Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cài đặt thư viện
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Cập nhật dữ liệu Thị trường (Vàng, USD, Xăng dầu)
      run: python update_market.py || echo "Lỗi khi lấy dữ liệu thị trường, bỏ qua"

    - name: Chạy Bot cào dữ liệu Xổ số
      run: python auto_bot.py || echo "Lỗi khi lấy dữ liệu xổ số, bỏ qua"

    - name: Commit và Đẩy dữ liệu mới lên Github
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add index.html market.json market-data.js vietlott.json || true
        git commit -m "Auto update dữ liệu xổ số và kinh tế" || echo "Không có thay đổi mới"
        git push
