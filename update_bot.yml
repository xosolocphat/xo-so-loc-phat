name: Auto Update Bot

on:
  schedule:
    - cron: '0 * * * *' # Chạy mỗi giờ (phút thứ 0)
  workflow_dispatch: # Cho phép bấm chạy thủ công trên web

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Kiểm tra mã nguồn
      uses: actions/checkout@v3

    - name: Cài đặt Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cài đặt thư viện
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Chạy Bot cào dữ liệu
      run: python auto_bot.py

    - name: Commit và Đẩy dữ liệu mới lên Github
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add index.html
        git commit -m "Auto update dữ liệu hàng giờ" || echo "Không có thay đổi mới"
        git push
